[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fociquant"
version = "0.1.0"
description = "Whole Culture Segmentation: mean foci-channel intensity inside cells, segmented from a membrane stain, with a desktop GUI"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Joaquin Smucler" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Topic :: Scientific/Engineering :: Image Processing",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "numpy>=1.23",
    "scipy>=1.9",
    "scikit-image>=0.20",
    "tifffile>=2022.8",
    "pandas>=1.5",
    "matplotlib>=3.9",
    "pillow>=9",
]

[project.optional-dependencies]
gui = ["pyqt6>=6.4", "pyqtgraph>=0.13.3"]
czi = ["aicspylibczi>=3.1"]
all = ["fociquant[gui,czi]"]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/joacosmucler/Whole-Culture-Segmentation"
Issues = "https://github.com/joacosmucler/Whole-Culture-Segmentation/issues"

[project.scripts]
fociquant-batch = "fociquant.cli:main"

[project.gui-scripts]
fociquant = "fociquant_gui.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fociquant*", "fociquant_gui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
