name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests · ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
        python: ["3.10", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
      FOCIQUANT_TEST: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Qt system libraries (Linux only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[all,dev]"
      - name: Tests (core + GUI, offscreen)
        run: python -m pytest -q

  launchers:
    name: double-click launcher · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      FOCIQUANT_TEST: "1"
      FOCIQUANT_SMOKE_EXIT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: macOS launcher (first run installs, then starts the app)
        if: runner.os == 'macOS'
        run: bash ./FociQuant-mac.command | tee launcher.log && grep -q "FociQuant started OK" launcher.log
      - name: Windows launcher (first run installs, then starts the app)
        if: runner.os == 'Windows'
        shell: cmd
        run: |
          call FociQuant-windows.bat > launcher.log 2>&1
          type launcher.log
          findstr /c:"FociQuant started OK" launcher.log
